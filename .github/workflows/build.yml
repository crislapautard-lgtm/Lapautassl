name: Build LaPautaSL VST3
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configurar CMake
        run: cmake -B build
      - name: Compilar VST3
        run: cmake --build build --config Release
      - name: Subir VST
        uses: actions/upload-artifact@v4
        with:
          name: LaPautaSL-VST
          path: build/**/*.vst3
